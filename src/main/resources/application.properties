# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.data.web.pageable.max-page-size=100

# ─── JWT ──────────────────────────────────────────────────────────────────────
# Minimum 256-bit (32-byte) base64-encoded secret. Replace via JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:a3Jpc2hpYWktc2VjdXJlLWtleS0yNTYtYml0LXNwZWNpZmljYXRpb24tcHJvdGVjdGVkLWV4cGVydC1hZHZpc29yeQ==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# ─── Admin Seed (DataInitializer) ─────────────────────────────────────────────
app.admin.email=${ADMIN_EMAIL:admin@krishiai.com}
app.admin.password=${ADMIN_PASSWORD:Admin@1234}
app.admin.Fullname=Platform

# ─── External Services ─────────────────────────────────────────────────────────
# Python FastAPI AI Service URL (Set mock=false when Python microservice is running)
krishiai.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}
krishiai.ai-service.mock=${AI_SERVICE_MOCK:true}

# Weather Service Integration
krishiai.weather.provider=${WEATHER_PROVIDER:openweather}
krishiai.weather.openweather.api-key=${OPENWEATHER_API_KEY:}
krishiai.weather.openweather.base-url=${OPENWEATHER_BASE_URL:https://api.openweathermap.org}
krishiai.weather.openmeteo.base-url=${OPENMETEO_BASE_URL:https://api.open-meteo.com}
krishiai.weather.timeout-seconds=${WEATHER_TIMEOUT_SECONDS:8}
krishiai.weather.fallback-enabled=${WEATHER_FALLBACK_ENABLED:true}

